<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — StayShare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="app-navbar"></div>

<section class="section" style="padding-top:56px;">
  <div class="container" style="max-width:440px;">
    <div class="form-card">
      <span class="eyebrow">Welcome back</span>
      <h1 style="font-size:26px; margin-bottom:6px;">Log in to StayShare</h1>
      <p class="text-muted" style="margin-bottom:26px; font-size:14px;">Guests, hoteliers, and admins all log in here.</p>

      <div class="alert alert-danger" id="login-error" style="display:none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Log in</button>
      </form>

      <p style="margin-top:20px; font-size:14px; text-align:center; color:var(--muted);">
        Don't have an account? <a href="register.html" style="color:var(--coral-dark); font-weight:600;">Sign up</a>
      </p>

      <hr class="divider">
      <p style="font-size:12.5px; color:var(--muted); margin-bottom:8px; font-weight:600;">Demo accounts</p>
      <div style="font-family:var(--font-mono); font-size:12px; color:var(--muted); line-height:1.9;">
        user@ &nbsp;taran@gmail.com / 123456<br>
        hotelier@ &nbsp;rahul@hotel.com / 123456<br>
        admin@ &nbsp;admin@stayshare.com / admin123
      </div>
    </div>
  </div>
</section>

<div id="app-footer"></div>

<script src="../js/store.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script>
  Components.renderNavbar("");
  Components.renderFooter();

  if (Auth.isLoggedIn()) {
    Auth.redirectToDashboard(Auth.currentUser().role);
  }

  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("login-error");

  form.addEventListener("submit", e => {
    e.preventDefault();
    errorBox.style.display = "none";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const result = Auth.login(email, password);
    if (!result.ok) {
      errorBox.textContent = result.message;
      errorBox.style.display = "flex";
      return;
    }
    Components.toast("Welcome back, " + result.user.name.split(" ")[0] + "!", "success");
    setTimeout(() => Auth.redirectToDashboard(result.user.role), 400);
  });
</script>
</body>
</html>
