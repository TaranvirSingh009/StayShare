<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — StayShare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="app-navbar"></div>

<section class="section">
  <div class="container">
    <div class="dashboard-shell">
      <aside class="dash-sidebar">
        <div class="dash-sidebar-header">
          <div class="dash-name" id="side-name">—</div>
          <div class="dash-email" id="side-email">—</div>
        </div>
        <nav class="dash-nav">
          <a href="#" data-panel="trips" class="active">🧳 My Trips</a>
          <a href="#" data-panel="wishlist">♥ Wishlist</a>
          <a href="#" data-panel="sharing">🤝 Roommate Requests</a>
          <a href="#" data-panel="messages">✉ Messages</a>
          <a href="#" data-panel="profile">⚙ Profile</a>
          <button class="dash-logout" id="logout-btn">↪ Log out</button>
        </nav>
      </aside>

      <main class="dash-main">
        <h1>My Dashboard</h1>
        <p class="text-muted" style="margin-bottom:24px;">Manage your bookings, saved stays, and roommate requests.</p>

        <div class="dash-panel active" id="panel-trips">
          <div class="stat-grid" style="margin-bottom:26px;">
            <div class="stat-card"><div class="stat-label">Upcoming</div><div class="stat-value" id="stat-upcoming">0</div></div>
            <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value" id="stat-completed">0</div></div>
            <div class="stat-card"><div class="stat-label">Total Spent</div><div class="stat-value" id="stat-spent">₹0</div></div>
          </div>
          <div class="dash-list" id="trips-list"></div>
        </div>

        <div class="dash-panel" id="panel-wishlist">
          <div class="property-grid" id="wishlist-list"></div>
        </div>

        <div class="dash-panel" id="panel-sharing">
          <h3 style="font-size:17px; margin-bottom:12px;">Requests for your shared rooms</h3>
          <div class="dash-list" id="incoming-requests" style="margin-bottom:32px;"></div>
          <h3 style="font-size:17px; margin-bottom:12px;">Your requests to other hosts</h3>
          <div class="dash-list" id="outgoing-requests"></div>
        </div>

        <div class="dash-panel" id="panel-messages">
          <div class="dash-list" id="messages-list"></div>
        </div>

        <div class="dash-panel" id="panel-profile">
          <div class="form-card" style="max-width:480px;">
            <div class="form-group">
              <label>Full name</label>
              <input class="form-control" id="profile-name">
            </div>
            <div class="form-group">
              <label>Email</label>
              <input class="form-control" id="profile-email" disabled>
              <p class="form-hint">Email cannot be changed in this demo.</p>
            </div>
            <div class="form-group">
              <label>New password (optional)</label>
              <input class="form-control" type="password" id="profile-password" placeholder="Leave blank to keep current password">
            </div>
            <button class="btn btn-primary" id="save-profile-btn">Save changes</button>
          </div>
        </div>
      </main>
    </div>
  </div>
</section>

<div id="app-footer"></div>

<script src="../js/store.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script>
  Components.renderNavbar("");
  Components.renderFooter();
  const user = Auth.requireRole("user");

  if (user) {
    document.getElementById("side-name").textContent = user.name;
    document.getElementById("side-email").textContent = user.email;
    document.getElementById("profile-name").value = user.name;
    document.getElementById("profile-email").value = user.email;

    setupTabs();
    renderTrips();
    renderWishlist();
    renderSharing();
    renderMessages();

    document.getElementById("logout-btn").addEventListener("click", () => {
      Auth.logout();
      location.href = "../index.html";
    });

    document.getElementById("save-profile-btn").addEventListener("click", () => {
      const users = Store.getUsers();
      const u = users.find(x => x.id === user.id);
      u.name = document.getElementById("profile-name").value.trim() || u.name;
      const newPass = document.getElementById("profile-password").value;
      if (newPass) u.password = newPass;
      Store.setUsers(users);
      document.getElementById("profile-password").value = "";
      Components.toast("Profile updated", "success");
      document.getElementById("side-name").textContent = u.name;
    });
  }

  function setupTabs() {
    const links = document.querySelectorAll(".dash-nav a[data-panel]");
    links.forEach(link => {
      link.addEventListener("click", e => {
        e.preventDefault();
        links.forEach(l => l.classList.remove("active"));
        link.classList.add("active");
        document.querySelectorAll(".dash-panel").forEach(p => p.classList.remove("active"));
        document.getElementById("panel-" + link.dataset.panel).classList.add("active");
      });
    });
  }

  function renderTrips() {
    const bookings = Store.getBookings().filter(b => b.userId === user.id).sort((a, b) => b.createdAt - a.createdAt);
    const properties = Store.getProperties();

    document.getElementById("stat-upcoming").textContent = bookings.filter(b => b.status === "upcoming").length;
    document.getElementById("stat-completed").textContent = bookings.filter(b => b.status === "completed").length;
    document.getElementById("stat-spent").textContent = "₹" + bookings.reduce((sum, b) => sum + b.totalPrice, 0).toLocaleString("en-IN");

    const list = document.getElementById("trips-list");
    if (bookings.length === 0) {
      list.innerHTML = Components.emptyState("No bookings yet", "Search for a stay to make your first booking.");
      return;
    }
    list.innerHTML = bookings.map(b => {
      const property = properties.find(p => p.id === b.propertyId);
      if (!property) return "";
      const room = property.rooms.find(r => r.id === b.roomId);
      return `
        <div class="booking-card">
          <div class="booking-card-img" style="background-image:url('${placeholderImage(property.name, property.city)}')"></div>
          <div class="booking-card-body">
            <h4>${escapeHtml(property.name)}</h4>
            <p class="text-muted" style="font-size:13px;">${escapeHtml(room ? room.type : "")} · 📍 ${escapeHtml(property.city)}</p>
            <div class="booking-meta">
              <span>📅 ${formatDate(b.checkIn)} → ${formatDate(b.checkOut)}</span>
              <span>👥 ${b.guests} guests</span>
              <span>₹${b.totalPrice.toLocaleString("en-IN")}</span>
            </div>
          </div>
          <div class="booking-card-actions">
            <span class="badge badge-${b.status}">${b.status}</span>
            ${b.sharing ? '<span class="badge badge-active">Shared</span>' : ''}
            ${b.status === "upcoming" && !b.sharing ? `<button class="btn btn-sm btn-outline" data-share="${b.id}">Share room</button>` : ""}
            ${b.status === "upcoming" ? `<button class="btn btn-sm btn-ghost" data-cancel="${b.id}" style="color:var(--danger);">Cancel</button>` : ""}
          </div>
        </div>`;
    }).join("");

    list.querySelectorAll("[data-share]").forEach(btn => {
      btn.addEventListener("click", () => {
        const bookings2 = Store.getBookings();
        const b = bookings2.find(x => x.id === btn.dataset.share);
        b.sharing = true;
        Store.setBookings(bookings2);
        Components.toast("Room listed for sharing!", "success");
        renderTrips();
      });
    });
    list.querySelectorAll("[data-cancel]").forEach(btn => {
      btn.addEventListener("click", () => {
        Components.confirmModal("Cancel this booking?", "This will cancel your reservation. This action can't be undone.", () => {
          const bookings2 = Store.getBookings();
          const b = bookings2.find(x => x.id === btn.dataset.cancel);
          b.status = "cancelled";
          b.sharing = false;
          Store.setBookings(bookings2);
          Components.toast("Booking cancelled", "info");
          renderTrips();
        }, "Cancel booking");
      });
    });
  }

  function renderWishlist() {
    const items = Store.getWishlist().filter(w => w.userId === user.id);
    const properties = Store.getProperties();
    const grid = document.getElementById("wishlist-list");
    if (items.length === 0) {
      grid.innerHTML = Components.emptyState("Your wishlist is empty", "Tap ♡ Save on any property to add it here.");
      return;
    }
    grid.innerHTML = items.map(item => {
      const p = properties.find(x => x.id === item.propertyId);
      if (!p) return "";
      return `
        <div style="position:relative;">
          <button class="wishlist-remove" data-remove="${p.id}">✕</button>
          ${Components.propertyCard(p)}
        </div>`;
    }).join("");

    grid.querySelectorAll("[data-remove]").forEach(btn => {
      btn.addEventListener("click", () => {
        let list = Store.getWishlist();
        list = list.filter(w => !(w.userId === user.id && w.propertyId === btn.dataset.remove));
        Store.setWishlist(list);
        Components.toast("Removed from wishlist", "info");
        renderWishlist();
      });
    });
  }

  function renderSharing() {
    const requests = Store.getSharingRequests();
    const bookings = Store.getBookings();
    const properties = Store.getProperties();
    const users = Store.getUsers();

    const incoming = requests.filter(r => r.ownerUserId === user.id);
    const incomingEl = document.getElementById("incoming-requests");
    if (incoming.length === 0) {
      incomingEl.innerHTML = Components.emptyState("No one has requested your shared rooms yet");
    } else {
      incomingEl.innerHTML = incoming.map(r => {
        const booking = bookings.find(b => b.id === r.bookingId);
        const property = booking ? properties.find(p => p.id === booking.propertyId) : null;
        const requester = users.find(u => u.id === r.requesterUserId);
        return `
          <div class="roommate-card">
            <div class="roommate-card-info">
              <h4>${escapeHtml(requester ? requester.name : "Unknown")}</h4>
              <p>${escapeHtml(property ? property.name : "")} · ${r.message ? escapeHtml(r.message) : "No message"}</p>
            </div>
            <div class="roommate-actions">
              ${r.status === "pending" ? `
                <button class="btn btn-sm btn-success" data-accept="${r.id}">Accept</button>
                <button class="btn btn-sm btn-danger" data-reject="${r.id}">Reject</button>
              ` : `<span class="badge badge-${r.status}">${r.status}</span>`}
            </div>
          </div>`;
      }).join("");

      incomingEl.querySelectorAll("[data-accept]").forEach(btn => {
        btn.addEventListener("click", () => {
          const reqs = Store.getSharingRequests();
          const r = reqs.find(x => x.id === btn.dataset.accept);
          r.status = "accepted";
          Store.setSharingRequests(reqs);
          Components.toast("Request accepted", "success");
          renderSharing();
        });
      });
      incomingEl.querySelectorAll("[data-reject]").forEach(btn => {
        btn.addEventListener("click", () => {
          const reqs = Store.getSharingRequests();
          const r = reqs.find(x => x.id === btn.dataset.reject);
          r.status = "rejected";
          Store.setSharingRequests(reqs);
          Components.toast("Request rejected", "info");
          renderSharing();
        });
      });
    }

    const outgoing = requests.filter(r => r.requesterUserId === user.id);
    const outgoingEl = document.getElementById("outgoing-requests");
    if (outgoing.length === 0) {
      outgoingEl.innerHTML = Components.emptyState("You haven't requested to join any shared rooms yet", "Browse Shared Rooms from the navbar to find one.");
    } else {
      outgoingEl.innerHTML = outgoing.map(r => {
        const booking = bookings.find(b => b.id === r.bookingId);
        const property = booking ? properties.find(p => p.id === booking.propertyId) : null;
        return `
          <div class="roommate-card">
            <div class="roommate-card-info">
              <h4>${escapeHtml(property ? property.name : "Listing removed")}</h4>
              <p>${property ? escapeHtml(property.city) : ""}</p>
            </div>
            <span class="badge badge-${r.status}">${r.status}</span>
          </div>`;
      }).join("");
    }
  }

  function renderMessages() {
    const requests = Store.getSharingRequests().filter(r => r.ownerUserId === user.id || r.requesterUserId === user.id);
    const users = Store.getUsers();
    const bookings = Store.getBookings();
    const properties = Store.getProperties();
    const list = document.getElementById("messages-list");

    if (requests.length === 0) {
      list.innerHTML = Components.emptyState("No messages yet", "Messages appear here when someone requests to share your room, or you request one.");
      return;
    }
    list.innerHTML = requests.slice().sort((a,b) => b.createdAt - a.createdAt).map(r => {
      const isOwner = r.ownerUserId === user.id;
      const other = users.find(u => u.id === (isOwner ? r.requesterUserId : r.ownerUserId));
      const booking = bookings.find(b => b.id === r.bookingId);
      const property = booking ? properties.find(p => p.id === booking.propertyId) : null;
      return `
        <div class="card-flat">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>${escapeHtml(other ? other.name : "Unknown")}</strong>
            <span class="badge badge-${r.status}">${r.status}</span>
          </div>
          <p class="text-muted" style="font-size:13px; margin-top:4px;">Re: ${escapeHtml(property ? property.name : "a shared room")}</p>
          <p style="margin-top:8px; font-size:14px;">${r.message ? escapeHtml(r.message) : "<em>No message included</em>"}</p>
        </div>`;
    }).join("");
  }
</script>
</body>
</html>
